
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitPulse — 100% Free AI Fitness Coach & Workout Videos</title>
    <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

    <style>
        /* =====================================================================
           1. BRIGHT DAYLIGHT EDITORIAL DESIGN TOKENS
           ===================================================================== */
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --ink: #111827;
            --muted: #5f697a;
            --accent: #0f766e;
            --accent-hover: #115e59;
            --accent-soft: #e6f4f1;
            --accent-border: #99f6e4;
            --border: #e5e7eb;
            --radius-xl: 18px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-pill: 9999px;
            --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.04);
            --shadow-md: 0 8px 24px -8px rgba(17, 24, 39, 0.08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-heading {
            font-family: "Space Grotesk", "Plus Jakarta Sans", sans-serif;
            letter-spacing: -0.02em;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================================
           2. HEADER & TWO-TAB NAVIGATION
           ===================================================================== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 30;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .header-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-name {
            font-family: "Space Grotesk", sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--ink);
        }

        .free-pill {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            padding: 3px 10px;
            border-radius: var(--radius-pill);
        }

        .tab-bar {
            display: inline-flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 3px;
            gap: 4px;
        }

        .tab-btn {
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .tab-btn:hover {
            color: var(--ink);
        }

        .tab-btn.active {
            background: var(--surface);
            color: var(--accent);
            font-weight: 700;
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
        }

        .header-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .control-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 6px 10px;
            font-size: 12px;
        }

        .control-pill label {
            color: var(--muted);
            font-weight: 600;
        }

        .control-pill select {
            border: none;
            background: transparent;
            color: var(--ink);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        .account-pill-btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }

        .account-pill-btn:hover {
            border-color: var(--accent-border);
            background: var(--accent-soft);
            color: var(--accent);
        }

        .account-avatar-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            color: #ffffff;
            font-size: 10.5px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.02em;
        }

        .account-status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: var(--radius-pill);
        }

        .account-status-chip strong {
            color: var(--ink);
            font-weight: 700;
        }

        .account-form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 540px) {
            .account-form-grid.two-col {
                grid-template-columns: 1fr 1fr;
            }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--ink);
        }

        .field-input, .field-select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 9px 12px;
            font-family: inherit;
            font-size: 13px;
            color: var(--ink);
            outline: none;
        }

        .field-input:focus, .field-select:focus {
            border-color: var(--accent);
            background: var(--surface);
        }

        .account-summary-banner {
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .account-banner-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--accent);
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* =====================================================================
           2B. HOME SCREEN (#homeScreen) & TWO-SCREEN LAYOUT
           ===================================================================== */
        .home-screen {
            flex: 1;
            max-width: 1120px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 16px 44px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .home-hero-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: 28px 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: center;
        }

        @media (min-width: 860px) {
            .home-hero-card {
                grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.9fr);
                padding: 36px 34px;
            }
        }

        .home-eyebrow-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .home-hero-title {
            margin: 0 0 12px;
            font-size: 30px;
            line-height: 1.15;
            font-weight: 700;
            color: var(--ink);
        }

        @media (min-width: 640px) {
            .home-hero-title {
                font-size: 38px;
            }
        }

        .home-hero-copy {
            margin: 0 0 22px;
            font-size: 15px;
            color: var(--muted);
            max-width: 580px;
        }

        .home-cta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .home-secondary-cta {
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--ink);
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.15s ease;
        }

        .home-secondary-cta:hover {
            background: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent);
        }

        .home-snapshot-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .home-snapshot-metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .home-metric-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 11px 12px;
        }

        .home-metric-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            display: block;
            margin-bottom: 2px;
        }

        .home-metric-value {
            font-family: "Space Grotesk", sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
        }

        .home-features-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 16px;
        }

        @media (min-width: 640px) {
            .home-features-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1024px) {
            .home-features-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        .home-feature-card {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .home-feature-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .home-feature-card h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
        }

        .home-feature-card p {
            margin: 0;
            font-size: 12.5px;
            color: var(--muted);
        }

        /* =====================================================================
           3. MAIN CONTENT & SURFACES
           ===================================================================== */
        .main-shell {
            flex: 1;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px 32px;
        }

        .surface {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
        }

        .coach-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (min-width: 1024px) {
            .coach-layout {
                grid-template-columns: minmax(0, 8fr) minmax(0, 4fr);
            }
        }

        /* =====================================================================
           4. AI COACH CHAT & SECTIONED PASSAGES
           ===================================================================== */
        .coach-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 74vh;
        }

        @media (min-width: 1024px) {
            .coach-card {
                height: calc(100vh - 116px);
            }
        }

        .coach-controls-bar {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            background: #fafbfc;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .profile-selectors {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .action-ghost {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 11px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .action-ghost:hover {
            color: var(--ink);
            background: #f3f4f6;
        }

        .starter-prompts-row {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .starter-prompts-row::-webkit-scrollbar {
            display: none;
        }

        .starter-btn {
            flex-shrink: 0;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--ink);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 13px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .starter-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent);
        }

        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f9fafb;
        }

        .message-line {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message-line.user {
            justify-content: flex-end;
        }

        .coach-icon-box {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .user-msg-bubble {
            background: var(--accent);
            color: #ffffff;
            border-radius: 16px 16px 4px 16px;
            padding: 10px 15px;
            max-width: 82%;
            font-size: 14px;
            box-shadow: var(--shadow-sm);
        }

        .coach-msg-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px 16px 16px 16px;
            padding: 14px 16px;
            width: 100%;
            max-width: 92%;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .coach-msg-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .coach-sender {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
        }

        .context-chip {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            padding: 2px 9px;
            border-radius: var(--radius-pill);
        }

        /* Individual Section Card */
        .section-block {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .section-block.speaking {
            border-color: var(--accent);
            background: #f0fdfa;
        }

        .section-block-head {
